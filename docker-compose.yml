# ============================================================
# Docker Compose — 一键部署 ChatGPT Plus 自动化开通工具
# 包含 MySQL 8 + 应用服务
# ============================================================
name: kc-gpt-pay2

services:
  mysql:
    image: mysql:8.0
    container_name: kc-gpt-pay2-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-your_mysql_password}
      MYSQL_DATABASE: ${DB_NAME:-plus_papay}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    container_name: kc-gpt-pay2-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${PORT:-3100}:3000"
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-your_mysql_password}
      DB_NAME: ${DB_NAME:-plus_papay}
      DB_POOL_LIMIT: 60
      HEADFUL: ${HEADFUL:-0}
      CHROMIUM_CHANNEL: ${CHROMIUM_CHANNEL:-}
      XVFB_ENABLED: ${XVFB_ENABLED:-1}
      XVFB_START_TIMEOUT_SECONDS: ${XVFB_START_TIMEOUT_SECONDS:-10}
      CHECKOUT_MODE: ${CHECKOUT_MODE:-auto}
      CHECKOUT_UI_HEADFUL: ${CHECKOUT_UI_HEADFUL:-1}
      CHECKOUT_SENTINEL_INIT_TIMEOUT_MS: ${CHECKOUT_SENTINEL_INIT_TIMEOUT_MS:-30000}
      CHECKOUT_SENTINEL_TIMEOUT_MS: ${CHECKOUT_SENTINEL_TIMEOUT_MS:-30000}
      CHECKOUT_API_TIMEOUT_MS: ${CHECKOUT_API_TIMEOUT_MS:-30000}
      PROXY: ${PROXY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      HCAPTCHA_CONFIG_FILE: /app/data/hcaptcha-config.json
      HCAPTCHA_VLM_API_KEY: ${HCAPTCHA_VLM_API_KEY:-}
      HCAPTCHA_VLM_BASE_URL: ${HCAPTCHA_VLM_BASE_URL:-https://api.openai.com/v1}
      HCAPTCHA_VLM_MODEL: ${HCAPTCHA_VLM_MODEL:-gpt-5.5}
      HCAPTCHA_CAPTCHA_PLATFORM_API_KEY: ${HCAPTCHA_CAPTCHA_PLATFORM_API_KEY:-}
      HCAPTCHA_CAPTCHA_PLATFORM_API_URL: ${HCAPTCHA_CAPTCHA_PLATFORM_API_URL:-https://api.capsolver.com}
      HCAPTCHA_CAPTCHA_PLATFORM_TIMEOUT: ${HCAPTCHA_CAPTCHA_PLATFORM_TIMEOUT:-180}
      CAPTCHARUN_API_TOKEN: ${CAPTCHARUN_API_TOKEN:-}
      CAPTCHARUN_TIMEOUT_SEC: ${CAPTCHARUN_TIMEOUT_SEC:-20}
      HCAPTCHA_SOLVER_ENABLED: ${HCAPTCHA_SOLVER_ENABLED:-1}
      CHATGPT_SESSION_COOKIE: ${CHATGPT_SESSION_COOKIE:-}
      BROWSER_POOL: ${BROWSER_POOL:-1}
      BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-2}
      BROWSER_POOL_MAX_SIZE: ${BROWSER_POOL_MAX_SIZE:-24}
      BROWSER_POOL_BASE_PORT: ${BROWSER_POOL_BASE_PORT:-19222}
    volumes:
      - ./debug_screenshots:/app/debug_screenshots
      - ./data:/app/data
      - ./product_files:/app/product_files
      - ./public:/app/public
      - ./server.js:/app/server.js
      - ./index.js:/app/index.js
      - ./src:/app/src:ro
      - ./database:/app/database:ro
      - ./scripts/docker-entrypoint.sh:/app/scripts/docker-entrypoint.sh
      - ./hcaptcha/solver.py:/app/hcaptcha/solver.py
    # 浏览器自动化 + hCaptcha ML 推理需要较大共享内存
    shm_size: '2gb'
    deploy:
      resources:
        limits:
          memory: 6G

volumes:
  mysql_data:
